name: Novel Crawler

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'URL to crawl'
        required: true
      translate:
        description: 'Translate to English (true/false)'
        required: false
        default: 'true'

jobs:
  crawl:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        
    - name: Clear results folder
      run: rm -rf results || true

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        
    - name: Install Node.js dependencies
      run: npm install
      
    - name: Install Puppeteer dependencies (only if translating)
      if: ${{ github.event.inputs.translate == 'true' }}
      run: |
        # Minimal required dependencies for headless Chrome on GitHub Actions
        sudo apt-get update -qq
        sudo apt-get install -y -qq --no-install-recommends \
          libgbm-dev \
          libxshmfence-dev \
          libasound2 \
          libatk-bridge2.0-0 \
          libgtk-3-0 \
          libnss3 \
          libxss1 \
          libxtst6 \
          xdg-utils \
          libatspi2.0-0 \
          fonts-noto-cjk
        
        # Verify installation
        google-chrome --version || echo "Chrome not installed (using Puppeteer's bundled version)"

    - name: Run crawler (without translation)
      if: ${{ github.event.inputs.translate != 'true' }}
      run: node script/script2.js "${{ github.event.inputs.url }}"
      
    - name: Run crawler with translation
      if: ${{ github.event.inputs.translate == 'true' }}
      run: node script/script2.js "${{ github.event.inputs.url }}" translate
      env:
        PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: 'false'
        # Important: Use Puppeteer's bundled Chromium instead of system Chrome
        PUPPETEER_EXECUTABLE_PATH: '/usr/bin/chromium-browser'

    - name: Commit and push results
      run: |
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        mkdir -p results
        git add results/
        git diff --quiet --cached || git commit -m "Updated novel crawl results - URL: ${{ github.event.inputs.url }}${{ github.event.inputs.translate == 'true' && ' (Translated to English)' || '' }}"
        git push || echo "Nothing to push"
