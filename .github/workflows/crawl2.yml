name: Novel Crawler

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'URL to crawl'
        required: true
      translate:
        description: 'Translate to English (true/false)'
        required: false
        default: 'false'

jobs:
  crawl:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        
    - name: Clear results folder
      run: rm -rf results || true

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        
    - name: Install Node.js dependencies
      run: npm install
      
    - name: Install minimal Puppeteer dependencies (only if translating)
      if: ${{ github.event.inputs.translate == 'true' }}
      run: |
        # Only 2 packages are REQUIRED for headless Chromium on GitHub Actions
        sudo apt-get update -qq 2>/dev/null || true
        sudo apt-get install -y -qq --no-install-recommends \
          libgbm-dev \
          libxshmfence-dev \
        || echo "Warning: Some dependencies failed to install (usually OK)"
        
        # Optional: Install Chinese fonts for better rendering (non-critical)
        sudo apt-get install -y -qq fonts-noto-cjk 2>/dev/null || true

    - name: Run crawler (without translation)
      if: ${{ github.event.inputs.translate != 'true' }}
      run: node script/script2.js "${{ github.event.inputs.url }}"
      
    - name: Run crawler with translation
      if: ${{ github.event.inputs.translate == 'true' }}
      run: node script/script2.js "${{ github.event.inputs.url }}" translate
      env:
        # Critical: Use Puppeteer's bundled Chromium (no system Chrome needed)
        PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: 'false'

    - name: Commit and push results
      run: |
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        mkdir -p results
        git add results/ 2>/dev/null || true
        if git diff --quiet --cached; then
          echo "No changes to commit"
        else
          git commit -m "Updated novel crawl results - URL: ${{ github.event.inputs.url }}${{ github.event.inputs.translate == 'true' && ' (Translated to English)' || '' }}"
          git push
        fi
